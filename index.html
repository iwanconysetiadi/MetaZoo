<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METAZOO — Optimization World</title>
  <style>
    :root {
      /* ---- color tokens ---- */
      --mz-sky-deep: #587e9e; --mz-sky-mid: #86a8bf; --mz-sky-light: #b7cdd7; --mz-horizon: #ebe4d6;
      --mz-cloud-light: #faf7f0; --mz-cloud-warm: #f2ebdd; --mz-cloud-cool: #d7e1e5; --mz-cloud-shadow: #bccdd6;
      --mz-terrain-low: #214e3a; --mz-terrain-moist: #365f47; --mz-terrain-grass: #557654; --mz-terrain-dry: #77785d;
      --mz-rock-deep: #394446; --mz-rock-mid: #4d5857; --mz-rock-light: #70766f;
      --mz-ui-bg: rgba(14,25,34,.72); --mz-ui-bg-soft: rgba(20,34,44,.60); --mz-ui-border: rgba(228,236,233,.14);
      --mz-text-primary: #edf2ee; --mz-text-secondary: #a8b5b7; --mz-text-muted: #7e9095;
      --mz-jade: #78b8a4; --mz-jade-soft: #92c8b6; --mz-gold: #c5a56a; --mz-gold-soft: #d6bd88; --mz-danger: #c98273;
      --bg: #0e1922; --bg-2: #14222c;
      --panel: var(--mz-ui-bg); --panel-solid: #14222c;
      --line: var(--mz-ui-border); --line-strong: rgba(228,236,233,.24);
      --fg: var(--mz-text-primary); --fg-dim: var(--mz-text-secondary); --muted: var(--mz-text-muted);
      --accent: var(--mz-jade); --accent-2: var(--mz-jade-soft); --accent-soft: rgba(120,184,164,.14);
      --gold: var(--mz-gold); --red: var(--mz-danger); --violet: #a2b1c4; --cyan: #a8c9dc;
      --shadow: 0 12px 36px rgba(10,20,28,.16);

      /* ---- spacing ---- */
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
      /* ---- radius ---- */
      --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-pill: 999px;
      /* ---- motion ---- */
      --m-fast: 140ms cubic-bezier(0.4, 0, 0.2, 1);
      --m-med: 240ms cubic-bezier(0.4, 0, 0.2, 1);
      --m-slow: 420ms cubic-bezier(0.4, 0, 0.2, 1);
      /* ---- z ---- */
      --z-world: 0; --z-ui: 20; --z-panel: 25; --z-modal: 60; --z-boot: 90;

      /* ---- type ---- */
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: var(--font-ui); letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    button { font-family: inherit; }
    select { color-scheme: dark; }
    select option { background: var(--panel-solid); color: var(--fg); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(228,236,233,0.18); border-radius: 4px; }

    /* ===================== TOP BAR ===================== */
    #ui-top {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      display: flex; align-items: center; gap: var(--s4);
      padding: 0 var(--s5);
      background: none;
      z-index: var(--z-ui);
      pointer-events: none;
    }
    #ui-top > * { pointer-events: auto; }

    .brand { display: flex; flex-direction: column; line-height: 1.05; user-select: none; }
    .brand .mark {
      font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.2em;
      font-size: 15px; color: var(--fg);
    }
    .brand .tag {
      font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); margin-top: 2px;
    }

    .fn-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; padding: 6px 16px; border-radius: var(--r-md);
      transition: background var(--m-fast);
    }
    .fn-title:hover { background: var(--mz-ui-bg-soft); }
    .fn-title .name { font-size: 14px; font-weight: 700; letter-spacing: 0.035em; text-transform: uppercase; }
    .fn-title .story {
      font-family: Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic;
      letter-spacing: 0.015em; color: var(--gold); opacity: 0.96;
    }
    .fn-title .chev { font-size: 9px; color: var(--muted); margin-left: 6px; }
    .fn-title .fn-class {
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); opacity: 0.85; margin-top: 1px;
    }

    .top-right { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }

    .seg {
      display: flex; gap: 2px; padding: 3px;
      background: var(--mz-ui-bg-soft); border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .seg button {
      appearance: none; border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
      padding: 6px 13px; border-radius: var(--r-sm); cursor: pointer;
      transition: color var(--m-fast), background var(--m-fast);
    }
    .seg button:hover { color: var(--fg); }
    .seg button.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(120,184,164,0.24); }

    .atmosphere-toggle {
      appearance: none; display: inline-flex; align-items: center; gap: 7px;
      min-height: 36px; padding: 0 12px; border-radius: var(--r-sm);
      background: var(--mz-ui-bg); border: 1px solid rgba(181, 139, 84, 0.25);
      color: var(--gold); font-size: 11px; font-weight: 650; letter-spacing: 0.025em;
      white-space: nowrap; cursor: pointer;
      transition: background var(--m-med), border-color var(--m-med), color var(--m-med);
    }
    .atmosphere-toggle:hover { background: var(--mz-ui-bg-soft); border-color: rgba(181, 139, 84, 0.42); }
    .atmosphere-toggle[aria-pressed="true"] { background: rgba(14,25,34,.80); border-color: var(--line); color: var(--gold); }

    .icon-btn {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--r-sm);
      background: var(--mz-ui-bg-soft); border: 1px solid var(--line);
      color: var(--fg-dim); cursor: pointer; font-size: 15px;
      transition: color var(--m-fast), background var(--m-fast), border-color var(--m-fast);
    }
    .icon-btn:hover { color: var(--fg); border-color: var(--line-strong); }

    /* ===================== DOCK ===================== */
    #ui-dock {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      display: flex; gap: var(--s1); padding: 5px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--r-lg); backdrop-filter: blur(24px) saturate(135%);
      box-shadow: var(--shadow); z-index: var(--z-panel);
    }
    .dock-btn {
      appearance: none; border: none; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
      padding: 8px 15px; border-radius: var(--r-md); cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: color var(--m-fast), background var(--m-fast);
    }
    .dock-btn .ico { font-size: 13px; opacity: 0.9; }
    .dock-btn:hover { color: var(--fg); background: rgba(228,236,233,0.045); }
    .dock-btn.active { color: var(--accent); background: var(--accent-soft); }
    .dock-divider { width: 1px; height: 20px; align-self: center; margin: 0 3px; background: var(--line); }

    /* ===================== TOOL PANELS ===================== */
    #ui-panel-host {
      position: fixed; left: 50%; bottom: 98px; transform: translateX(-50%);
      z-index: var(--z-panel); width: min(360px, calc(100vw - 32px));
      display: none;
    }
    #ui-panel-host.open { display: block; }
    .tool-panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--r-lg); backdrop-filter: blur(24px) saturate(135%);
      box-shadow: var(--shadow); padding: var(--s2);
      animation: panel-in var(--m-med) both;
    }
    @keyframes panel-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .tool-panel h4 {
      margin: 0; padding: 6px 8px 10px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .tool-panel .pbody { padding: 0 4px 4px; }
    #ui-panel-host .tool-panel { max-height: calc(100vh - 150px); overflow-y: auto; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s3); padding: 7px 8px; border-radius: var(--r-sm);
      font-size: 12.5px; color: var(--fg-dim);
    }
    .row:hover { background: rgba(228,236,233,0.035); }
    .row .grow { flex: 1; }
    .row .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); }

    .switch { position: relative; width: 34px; height: 19px; border-radius: var(--r-pill);
      background: rgba(228,236,233,0.10); border: 1px solid var(--line);
      cursor: pointer; flex-shrink: 0; transition: background var(--m-fast); }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
      border-radius: 50%; background: var(--muted); transition: transform var(--m-fast), background var(--m-fast); }
    .switch.on { background: var(--accent-soft); border-color: rgba(120,184,164,0.36); }
    .switch.on::after { transform: translateX(15px); background: var(--accent); }

    input[type="range"] { appearance: none; width: 100%; height: 3px; border-radius: 2px;
      background: rgba(228,236,233,0.18); outline: none; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fffdfa; }

    .select { appearance: none; width: 100%; background: rgba(228,236,233,0.035);
      border: 1px solid var(--line); color: var(--fg); font-family: var(--font-mono);
      font-size: 11.5px; padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer; }

    .btn { appearance: none; border: 1px solid var(--line); background: rgba(228,236,233,0.035);
      color: var(--fg-dim); font-size: 12px; font-weight: 600; padding: 9px 12px;
      border-radius: var(--r-sm); cursor: pointer; transition: all var(--m-fast); }
    .btn:hover { color: var(--fg); border-color: var(--line-strong); background: rgba(228,236,233,0.065); }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 8px 20px rgba(120,184,164,0.20); }
    .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
    .btn-grid .wide { grid-column: span 2; }

    .group-label { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); padding: 10px 8px 4px; }

    /* Calm, consistent surfaces and controls */
    .tool-panel {
      border-color: rgba(255,255,255,0.12);
      background: var(--panel);
      backdrop-filter: blur(24px) saturate(135%);
      box-shadow: var(--shadow);
    }
    .tool-panel h4 { font-size: 11px; letter-spacing: 0.12em; color: var(--fg-dim); padding: 8px 10px 12px; }
    .tool-panel .pbody { padding: 0 6px 8px; }
    .group-label { font-size: 10px; letter-spacing: 0.12em; padding: 14px 10px 6px; }
    .row { min-height: 38px; font-size: 13px; }
    .btn, .select, .sim-select, .sim-input, .lab-input, .lab-textarea { border-radius: var(--r-md); }
    .btn { min-height: 38px; transition: transform var(--m-fast), background var(--m-fast), border-color var(--m-fast); }
    .btn:active { transform: scale(0.985); }
    .select, .sim-select { padding-right: 34px; background-repeat: no-repeat;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 11px) 50%; background-size: 4px 4px; }
    .analysis-reference { margin: 0 2px 5px; padding: 7px 8px; border-radius: var(--r-md); background: rgba(228,236,233,0.025); }
    .reference-state { flex: 0 0 auto; padding: 4px 8px; border-radius: var(--r-pill);
      border: 1px solid rgba(120,184,164,0.2); color: var(--accent); background: rgba(120,184,164,0.06);
      font-size: 10px; }
    .analysis-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
      margin: 5px 8px 12px; }
    .analysis-legend span { display: flex; align-items: center; gap: 7px; min-width: 0;
      padding: 7px 8px; border: 1px solid rgba(228,236,233,0.07); border-radius: var(--r-sm);
      background: rgba(228,236,233,0.025); color: var(--fg-dim); font-size: 11.5px; }
    .analysis-legend b { font-size: 13px; line-height: 1; }

    /* ===================== TELEMETRY ===================== */
    #ui-telemetry {
      position: fixed; left: var(--s5); bottom: 18px; z-index: var(--z-ui);
      display: flex; gap: var(--s5); align-items: center;
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
      white-space: nowrap; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #ui-telemetry .metric { display: flex; flex-direction: column; gap: 3px; }
    #ui-telemetry .k { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    #ui-telemetry .v { font-size: 15px; color: var(--fg); font-weight: 500; letter-spacing: 0.01em; }
    #ui-telemetry .v.opt { color: var(--accent); }
    #ui-telemetry .divider { width: 1px; height: 26px; background: var(--line); }
    #ui-telemetry.scientific .sci-only { display: flex; }
    #ui-telemetry .sci-only { display: none; }

    /* ===================== PROBE CARD ===================== */
    #ui-probe-card {
      position: fixed; z-index: var(--z-ui); pointer-events: none;
      min-width: 132px; padding: 10px 12px;
      background: var(--panel); border: 1px solid var(--line-strong);
      border-radius: var(--r-md); box-shadow: var(--shadow);
      font-family: var(--font-mono); font-size: 11px;
      opacity: 0; transform: translateY(4px); transition: opacity var(--m-fast), transform var(--m-fast);
    }
    #ui-probe-card.show { opacity: 1; transform: translateY(0); }
    #ui-probe-card .pc-row { display: flex; justify-content: space-between; gap: 16px; padding: 1px 0; color: var(--muted); }
    #ui-probe-card .pc-row b { color: var(--fg); font-weight: 500; }
    #ui-probe-card .pc-f { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 15px; color: var(--accent); }
    #ui-probe-card .pc-sci { display: none; }
    #ui-probe-card.sci .pc-sci { display: block; }

    /* ===================== WORLD SELECTOR MODAL ===================== */
    #ui-world-modal {
      position: fixed; inset: 0; z-index: var(--z-modal);
      display: none; align-items: center; justify-content: center;
      background: rgba(16, 25, 56, 0.24); backdrop-filter: blur(10px);
    }
    #ui-world-modal.open { display: flex; animation: fade-in var(--m-med) both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .world-modal-inner {
      width: min(1040px, calc(100vw - 48px)); max-height: calc(100vh - 96px);
      display: flex; flex-direction: column; gap: var(--s4);
      padding: var(--s5); border-radius: var(--r-lg);
      background: var(--panel);
      border: 1px solid var(--line-strong); box-shadow: var(--shadow);
    }
    .world-modal-inner h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em;
      color: var(--fg); font-weight: 700; }
    .atlas-heading p { margin: 4px 0 0; color: var(--fg-dim); font-size: 12px; }
    .world-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3);
      overflow-y: auto; padding-right: 4px; }
    .world-card {
      text-align: left; cursor: pointer; appearance: none;
      border: 1px solid var(--line); background: rgba(228,236,233,0.025);
      border-radius: var(--r-lg); padding: 10px;
      transition: border-color var(--m-fast), background var(--m-fast), transform var(--m-fast);
      color: var(--fg);
    }
    .world-card:hover { border-color: rgba(120,184,164,0.34); background: rgba(120,184,164,0.045); transform: translateY(-2px); }
    .world-card.active { border-color: var(--accent); }
    .world-card .wc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 10px 4px 0; }
    .world-card .wc-name { font-size: 14px; font-weight: 600; }
    .world-card .wc-sub { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-top: 3px; }
    .world-card .wc-badge { font-size: 9px; padding: 2px 7px; border-radius: var(--r-pill);
      border: 1px solid var(--line-strong); color: var(--muted); text-transform: capitalize; }
    .world-card .wc-desc { font-size: 11.5px; color: var(--fg-dim); margin: 10px 0; line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .world-card .wc-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); display: grid; gap: 2px; }
    .world-card .wc-meta b { color: var(--fg-dim); font-weight: 500; }
    .realm-title { color: var(--fg); font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.2; font-weight: 600; }
    .realm-function { color: var(--fg-dim); font-size: 11px; margin-top: 4px; }
    .realm-card .wc-desc { margin: 8px 4px; }
    .realm-card .wc-meta { margin: 0 4px 4px; }
    .realm-art { --island-top: #88b994; position: relative; height: 94px; overflow: hidden;
      border-radius: var(--r-md); isolation: isolate;
      background: linear-gradient(180deg, var(--mz-sky-deep), var(--mz-sky-mid) 65%, var(--mz-cloud-cool)); }
    .realm-art::before { content: ''; position: absolute; z-index: 0; left: 26%; right: 26%; top: 37%; height: 52%;
      clip-path: polygon(0 0,100% 0,82% 45%,58% 100%,42% 100%,18% 45%);
      background: linear-gradient(155deg,var(--mz-rock-light),var(--mz-rock-deep)); filter: drop-shadow(0 9px 5px rgba(228,236,233,0.18)); }
    .realm-art::after { content: ''; position: absolute; z-index: 1; left: 21%; right: 21%; top: 28%; height: 29%;
      border-radius: 50%; background: repeating-radial-gradient(ellipse at 50% 48%, transparent 0 6px, rgba(228,236,233,0.11) 7px 8px, transparent 9px 13px),
      radial-gradient(ellipse at 48% 40%, #849d83 0 18%, var(--island-top) 58%, #637c73 100%);
      box-shadow: 0 5px 12px rgba(228,236,233,0.16); }
    .realm-art[data-world="rastrigin"] { --island-top: #657b5e; }
    .realm-art[data-world="ackley"] { --island-top: #9ba9bb; }
    .realm-art[data-world="rosenbrock"] { --island-top: #a9c19e; }
    .realm-art[data-world="himmelblau"] { --island-top: #9ec9ad; }
    .realm-art[data-world="custom"] { --island-top: #638579; }
    .realm-art[data-world="challenge"] { --island-top: #80927a; }

    /* ===================== FUNCTION DRAWER ===================== */
    #ui-fn-drawer {
      position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 92vw);
      z-index: var(--z-modal); background: var(--panel);
      border-left: 1px solid var(--line-strong); box-shadow: -20px 0 60px rgba(0,0,0,0.5);
      transform: translateX(104%); transition: transform var(--m-slow);
      display: flex; flex-direction: column;
    }
    #ui-fn-drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between;
      padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
    .drawer-body { padding: var(--s5); overflow-y: auto; }
    .drawer-body .eq {
      font-family: var(--font-mono); font-size: 13px; color: var(--fg); line-height: 1.7;
      padding: var(--s4); background: rgba(228,236,233,0.035); border: 1px solid var(--line);
      border-radius: var(--r-md); margin: var(--s3) 0 var(--s5); white-space: pre-wrap; word-break: break-word;
    }
    .kv { display: flex; justify-content: space-between; gap: var(--s4); padding: 10px 0;
      border-bottom: 1px solid var(--line); font-size: 12.5px; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: var(--font-mono); color: var(--fg); }
    .drawer-body h3 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
    .drawer-body .cls { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .drawer-body p { color: var(--fg-dim); font-size: 12.5px; line-height: 1.6; margin: var(--s4) 0; }

    /* ===================== CUSTOM LAB ===================== */
    #ui-lab { position: fixed; inset: 0; z-index: 72; display: none;
      background: rgba(16,25,56,0.28); backdrop-filter: blur(10px); }
    #ui-lab.open { display: flex; align-items: center; justify-content: center; }
    .lab-shell { width: min(1120px, calc(100vw - 40px)); height: min(780px, calc(100vh - 48px));
      display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-lg);
      background: var(--panel);
      border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
    .lab-head { display: flex; align-items: center; justify-content: space-between;
